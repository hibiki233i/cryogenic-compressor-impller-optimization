name: CI

# Every push and pull request runs the offline checks: no ANSYS/CFturbo,
# no private training data. Real CFD / active-learning runs stay on the
# Windows engineering machine and are out of scope here.
# Branch commits are checked through their pull request; pushes to main
# (including merges) are checked directly. Avoids duplicate runs per commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  lint:
    name: Lint (syntax / undefined names)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module on the minimum supported Python
        run: python -m compileall -q -x '(^|/)\.' .
      - name: Ruff (errors only, no style rules)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 --output-format github .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-gui.txt

      - name: Install Qt runtime libraries (offscreen GUI tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-gui.txt
          python -m pip check
          python -m pip freeze

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Offline reproduction (documented example)
        run: python -m impeller_app.reproduce --config examples/offline/config.json --output-dir offline-output

      - name: Upload reproduction output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-output-${{ matrix.os }}-py${{ matrix.python }}
          path: offline-output/
          if-no-files-found: ignore
          retention-days: 14
